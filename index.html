    <meta name="description" content="RDDS Enterprises builds business websites and e-commerce stores in Pakistan and worldwide. Work directly with founder Danish Khan." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="google-site-verification" content="a_QZaduTa1l_w1B5su3YcUxNK0M_pjpztYS2g6QDSUI" />
    <link rel="canonical" href="https://rddsdigitalsolution.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RDDS Enterprises" />
    <meta property="og:title" content="RDDS Enterprises | Website Design & Development in Pakistan" />
    <meta property="og:description" content="Business websites and e-commerce stores in Pakistan and worldwide, built directly with founder Danish Khan." />
    <meta property="og:url" content="https://rddsdigitalsolution.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RDDS Enterprises | Website Design & Development in Pakistan" />
    <meta name="twitter:description" content="Business websites, e-commerce stores and custom web applications, designed and developed personally by Danish Khan." />
    <title>RDDS Enterprises | Website Design & Development in Pakistan</title>
    <script id="rdds-organization-schema" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "RDDS Enterprises",
        "url": "https://rddsdigitalsolution.vercel.app/",
        "founder": { "@type": "Person", "name": "Danish Khan" },
        "email": "rdds.enterprises@gmail.com"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const addStoreLink = () => {
          const nav = document.querySelector(".topbar nav");
          if (!nav || nav.querySelector('[data-rdds-store-link="true"]')) return;
          const link = document.createElement("a");
          link.href = "https://rddscustomize.vercel.app/";
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Customized Store";
          link.setAttribute("data-rdds-store-link", "true");
          link.style.whiteSpace = "nowrap";
          nav.insertBefore(link, nav.querySelector(".nav-cta") || null);
        };
        const observer = new MutationObserver(addStoreLink);
        observer.observe(document.getElementById("root"), { childList: true, subtree: true });
        addStoreLink();
      })();
    </script>
    <script type="module" src="/index.jsx"></script>
  </body>
</html>
